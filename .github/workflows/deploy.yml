# Builds the game and publishes it to GitHub Pages.
#
# Enable it once by setting Settings → Pages → Source to "GitHub Actions".
# BASE_HREF must match how the site is served: "/<repo-name>/" for a project
# site, "/" for a user site or a custom domain.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_HREF: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run test:ci
      - run: npm run build:pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/flag-reveal/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
